name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release

      - name: SPA redirects
        run: printf '/*    /index.html   200\n' > build/web/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name esep-wizard

      - name: Sync secrets to Pages Function
        run: |
          # Каждый секрет опционален: если GitHub-секрет задан — кладём в CF,
          # иначе пропускаем (можно добавить вручную в dashboard).
          for pair in \
            "OPENROUTER_API_KEY:${{ secrets.OPENROUTER_API_KEY }}" \
            "SUPABASE_URL:${{ secrets.SUPABASE_URL }}" \
            "SUPABASE_ANON_KEY:${{ secrets.SUPABASE_ANON_KEY }}" \
            "SUPABASE_SERVICE_ROLE_KEY:${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "GEMINI_API_KEY:${{ secrets.GEMINI_API_KEY }}" \
            "KASPI_SECRET_KEY:${{ secrets.KASPI_SECRET_KEY }}"
          do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ]; then
              echo "$val" | npx wrangler pages secret put "$name" --project-name esep-wizard
            else
              echo "No $name GitHub secret — skipping (dashboard secret covers it)"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
